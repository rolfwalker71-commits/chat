# Baut das App-Image und veröffentlicht es in der GitHub Container Registry.
# Image: ghcr.io/rolfwalker71-commits/chat
#
# Login nutzt GITHUB_TOKEN (packages: write). Ein separates PAT-Secret ist
# nicht nötig und war die Ursache für `denied: denied` am Registry-Login.
# Paket-Sichtbarkeit (public/private) steuert nur, wer pullen darf — nicht den Push.
#
# Falls der Push mit permission_denied: write_package scheitert: unter
# https://github.com/users/rolfwalker71-commits/packages/container/chat/settings
# das Repo verbinden und unter Manage Actions access die Rolle Write vergeben.

name: Publish to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=branch

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
