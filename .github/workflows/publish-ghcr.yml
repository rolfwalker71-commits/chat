# Baut das App-Image und veröffentlicht es in der GitHub Container Registry.
# Image: ghcr.io/rolfwalker71-commits/chat
#
# Das Paket wurde zuerst lokal per User-PAT nach GHCR geschoben und ist dadurch
# nicht mit diesem Repo verknüpft. GITHUB_TOKEN bekommt dann
# permission_denied: read_package. Solange das so ist, loggt der Workflow mit
# dem Repository-Secret GHCR_TOKEN (classic PAT, write:packages) ein.
# Nach dem Verknüpfen unter Package-Settings → Connect repository und
# Manage Actions access (Rolle Write) kann GHCR_TOKEN entfernt werden; der
# Login fällt dann auf GITHUB_TOKEN zurück.
# Sichtbarkeit ggf. unter https://github.com/users/rolfwalker71-commits/packages
# auf Public stellen, falls fremde Hosts pullen sollen.

name: Publish to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=branch

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
